# ---------------------------------------------------------------------------
# Retroo TV API — shared configuration.
# Profile-specific overrides live below the `---` separators.
# Every value can be overridden by an environment variable
# (e.g. RETROO_ADMIN_API_KEY, SPRING_DATASOURCE_URL).
# ---------------------------------------------------------------------------
spring:
  application:
    name: retroo-tv-api
  profiles:
    default: dev
  jpa:
    open-in-view: false            # no lazy loading in the web layer — DTOs only
    hibernate:
      ddl-auto: validate           # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate:
        jdbc.time_zone: UTC
        # Store java.time.Instant in a plain TIMESTAMP column (always UTC, see jdbc.time_zone).
        type.preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    # {vendor} resolves to "h2" or "oracle" from the JDBC URL: DDL is per-vendor, seed data is shared.
    locations: classpath:db/migration/{vendor},classpath:db/migration/common
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework   # trust X-Forwarded-* from nginx
  compression:
    enabled: true
    mime-types: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

retroo:
  # Origins allowed to call the API from a browser (only needed when the SPA is
  # served from a different origin than the API, e.g. `ng serve` without proxy).
  cors:
    allowed-origins: ${RETROO_CORS_ORIGINS:http://localhost:4200}
  admin:
    # Empty => admin endpoints are disabled (403). Set via env in real deployments.
    api-key: ${RETROO_ADMIN_API_KEY:}
  playlists:
    rate-limit:
      max-requests: 3
      window: 10m
  presence:
    heartbeat: 15s
  # Jam sessions (gemini.md §8) — in-memory watch-together rooms.
  jam:
    ttl: 60m                 # lifetime of a new jam
    extension: 60m           # one extension allowed (max 120 min total)
    ending-soon-before: 5m   # ENDING_SOON event this long before expiry
    max-active: 50           # create → 503 above this
    max-members: 50          # join → JAM_FULL above this
    create-rate-limit:
      max-requests: 3
      window: 1h
    chat-rate-limit:
      max-requests: 5
      window: 10s
    chat-history: 100        # messages kept per jam
    snapshot-chat: 50        # messages returned in a snapshot
    sweep-interval: 15s
  youtube:
    oembed-url: https://www.youtube.com/oembed
    timeout: 3s

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # File-based H2 in Oracle mode so data survives restarts and SQL stays Oracle-compatible.
    url: jdbc:h2:file:./data/retroo;MODE=Oracle;DATABASE_TO_UPPER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
retroo:
  admin:
    api-key: ${RETROO_ADMIN_API_KEY:dev-admin-key}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
springdoc:
  swagger-ui:
    enabled: false
logging:
  level:
    root: INFO
