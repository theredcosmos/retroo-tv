# nginx in front of the Angular SPA.
#  - Serves the static build with long-lived caching for hashed assets.
#  - Reverse-proxies /api and /ws to the Spring Boot container → one origin, so no CORS in production.
#  - Upgrades /ws to a WebSocket connection.
#  - Falls back to index.html for client-side routes.
#  - Client IP: the API rate-limits per IP and trusts X-Forwarded-For (forward-headers-strategy=framework), so
#    nginx must never pass a visitor's own X-Forwarded-For through — that would let anyone pick their "IP" and
#    bypass every limit. We accept the header only from private-network peers (Caddy / Docker in front of us),
#    then send the API exactly one address: the real client.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Security headers live in a snippet included in EVERY location below: nginx drops all inherited add_header
  # lines as soon as a location has an add_header of its own (our cache headers), so server-level headers here
  # would silently never be sent. (They weren't, until this was fixed.)
  include /etc/nginx/snippets/security-headers.conf;

  location /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append (see top)
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 1h;   # STOMP heart-beats keep it alive; don't cut idle listeners
  }

  # Hashed bundles never change → cache for a year.
  location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # index.html must always be revalidated so new deployments are picked up.
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
