<button type="button" class="ghost-btn share" (click)="open()">
  <span aria-hidden="true">＋</span> Share a playlist channel
</button>

<dialog #dialog aria-labelledby="share-title" (click)="onDialogClick($event)">
  <form class="panel" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <header>
      <h2 id="share-title">Share your playlist</h2>
      <button type="button" class="close" (click)="close()" aria-label="Close">✕</button>
    </header>
    <p class="hint">Your YouTube Music playlist becomes a channel: anyone here can tune their TV to it.</p>

    <label>
      <span>Your name</span>
      <input formControlName="displayName" maxlength="40" autocomplete="nickname" placeholder="e.g. Avanti"
             [attr.aria-invalid]="!!errorFor('displayName')" />
      @if (errorFor('displayName'); as e) { <small class="err">{{ e }}</small> }
    </label>

    <label>
      <span>Playlist link</span>
      <input formControlName="playlistUrl" inputmode="url" autocomplete="off"
             placeholder="https://music.youtube.com/playlist?list=…"
             [attr.aria-invalid]="!!errorFor('playlistUrl')" />
      @if (errorFor('playlistUrl'); as e) { <small class="err">{{ e }}</small> }
    </label>

    <label>
      <span>Playlist name</span>
      <input formControlName="playlistName" maxlength="80" placeholder="e.g. Energetic songs"
             [attr.aria-invalid]="!!errorFor('playlistName')" />
      @if (errorFor('playlistName'); as e) { <small class="err">{{ e }}</small> }
    </label>

    <label>
      <span>Note <em>(optional)</em></span>
      <textarea formControlName="note" rows="2" maxlength="140" placeholder="I listen to this when…"></textarea>
      <small class="count">{{ form.controls.note.value.length }}/140</small>
    </label>

    @if (formError(); as e) {
      <p class="form-err" role="alert">{{ e }}</p>
    }

    <footer>
      <button type="button" class="ghost-btn" (click)="close()">Cancel</button>
      <button type="submit" class="pill-btn" [disabled]="submitting()">
        {{ submitting() ? 'Sharing…' : 'Share' }}
      </button>
    </footer>
  </form>
</dialog>
