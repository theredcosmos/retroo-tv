# Security headers for every response. Included from each `location` in nginx.conf (see the note there).
#
# CSP, by directive:
#  script-src   our bundle + the YouTube IFrame API (www.youtube.com, s.ytimg.com). No inline scripts: Angular's
#               "inline critical CSS" (an onload= handler) is switched off in angular.json for this reason.
#  frame-src    the YouTube player iframe.
#  img-src      artwork thumbnails (i.ytimg.com) and the data: SVG film grain / wood grain textures.
#  style-src    our CSS, Angular's inlined component/font styles ('unsafe-inline'), Google Fonts CSS.
#  connect-src  same-origin REST and the STOMP WebSocket (ws: on http, wss: on https).
#  frame-ancestors 'none' + object-src 'none' + base-uri 'self': no clickjacking, plugins or <base> hijacking.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com; frame-src https://www.youtube.com; img-src 'self' https://i.ytimg.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
