name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: retroo-tv-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test (unit + integration on H2)
        run: sh ./mvnw -B verify   # `sh` because the wrapper was committed from Windows (no +x bit)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: retroo-tv-api/target/surefire-reports

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: retroo-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: retroo-tv/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm run test:ci
      - name: Production build
        run: npx ng build --configuration production

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t retroo-tv-api ./retroo-tv-api
          docker build -t retroo-tv-web ./retroo-tv
      - name: Check nginx config
        # nginx only reads its config at start-up, so a typo would otherwise surface on the server.
        # --add-host stands in for the compose service name the config proxies to.
        run: docker run --rm --add-host backend:127.0.0.1 retroo-tv-web nginx -t
      - name: Check security headers on every kind of response
        # nginx drops inherited add_header lines in any location that sets its own, so check the page
        # (location /) and a static asset (cached location) both carry the CSP and friends.
        run: |
          docker run -d --name web --add-host backend:127.0.0.1 -p 8088:80 retroo-tv-web
          sleep 2
          for path in / /favicon.ico; do
            headers=$(curl -s -D - -o /dev/null "http://localhost:8088$path")
            for h in content-security-policy x-content-type-options referrer-policy; do
              echo "$headers" | grep -qi "^$h:" || { echo "::error::$h missing on $path"; exit 1; }
            done
          done
          docker rm -f web
      - name: Check compose files
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.lite.yml config --quiet
          docker compose -f docker-compose.lite.yml -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.lite.yml -f docker-compose.tunnel.yml config --quiet
